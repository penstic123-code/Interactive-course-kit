<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <!-- 视口底部的纸片草地：三层小丘，每层 = 一张剪出来的绿纸（白色裁边 + 下面一层淡影）。
       左右两端的高度一致，横向平铺时接得上缝。为什么静态：常驻动画会让滚动掉帧。 -->
  <defs>
    <filter id="sh" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="3"/></filter>
  </defs>
  <!-- 最远一层：浅草绿 -->
  <path d="M0 96 C120 60 230 58 330 84 C430 110 520 70 640 62 C760 54 860 96 960 92 C1060 88 1130 70 1200 96 L1200 220 L0 220 Z" fill="#3f7a46" opacity=".18" transform="translate(4 7)" filter="url(#sh)"/>
  <path d="M0 96 C120 60 230 58 330 84 C430 110 520 70 640 62 C760 54 860 96 960 92 C1060 88 1130 70 1200 96 L1200 220 L0 220 Z" fill="#bfe6a4" stroke="#fffdf7" stroke-width="5" stroke-linejoin="round"/>
  <!-- 中间一层：草绿 -->
  <path d="M0 140 C90 112 180 104 270 120 C370 138 440 150 560 126 C680 102 780 108 880 132 C980 156 1080 120 1200 140 L1200 220 L0 220 Z" fill="#3f7a46" opacity=".2" transform="translate(4 7)" filter="url(#sh)"/>
  <path d="M0 140 C90 112 180 104 270 120 C370 138 440 150 560 126 C680 102 780 108 880 132 C980 156 1080 120 1200 140 L1200 220 L0 220 Z" fill="#8fd17a" stroke="#fffdf7" stroke-width="5" stroke-linejoin="round"/>
  <!-- 最近一层：深一点的草绿，带几簇草和小白花 -->
  <path d="M0 178 C140 160 250 156 380 170 C510 184 600 186 720 168 C840 150 960 160 1060 176 C1120 185 1160 182 1200 178 L1200 220 L0 220 Z" fill="#3f7a46" opacity=".22" transform="translate(3 6)" filter="url(#sh)"/>
  <path d="M0 178 C140 160 250 156 380 170 C510 184 600 186 720 168 C840 150 960 160 1060 176 C1120 185 1160 182 1200 178 L1200 220 L0 220 Z" fill="#62b763" stroke="#fffdf7" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#4a9a50" stroke="#fffdf7" stroke-width="2" stroke-linejoin="round">
    <path d="M150 168 l6 -18 l4 16 l6 -14 l3 16 z"/>
    <path d="M610 182 l5 -15 l4 13 l5 -12 l3 14 z"/>
    <path d="M980 166 l6 -17 l4 15 l6 -13 l3 15 z"/>
  </g>
  <g stroke="#fffdf7" stroke-width="1.5">
    <circle cx="300" cy="182" r="5" fill="#ffffff"/><circle cx="300" cy="182" r="2" fill="#f6c94b" stroke="none"/>
    <circle cx="820" cy="174" r="5" fill="#ffffff"/><circle cx="820" cy="174" r="2" fill="#f6c94b" stroke="none"/>
    <circle cx="1110" cy="190" r="4.5" fill="#ffd6e0"/><circle cx="1110" cy="190" r="1.8" fill="#f6c94b" stroke="none"/>
    <circle cx="470" cy="196" r="4.5" fill="#ffd6e0"/><circle cx="470" cy="196" r="1.8" fill="#f6c94b" stroke="none"/>
  </g>
</svg>
